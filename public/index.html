<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONY XMD PAIR</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
  body{background:#000;color:#00ff00;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .card{background:#020202;border:2px solid #00ff00;border-radius:12px;padding:25px;width:100%;max-width:480px;box-shadow:0 0 30px #00ff00}
  h1{color:#00ff00;text-align:center;margin-bottom:5px;font-size:28px}
  .sub{text-align:center;color:#0f0;font-size:11px;margin-bottom:20px}
  .tabs{display:flex;gap:10px;margin-bottom:15px}
  .tab{flex:1;padding:10px;background:#010101;border:1px solid #00ff00;color:#00ff00;border-radius:6px;text-align:center;font-weight:bold}
  .tab.active{background:#00ff00;color:#000}
  .servers{display:flex;gap:8px;margin:15px 0}
  .server{flex:1;padding:8px;background:#010101;border:1px solid #00ff00;border-radius:6px;text-align:center;font-size:12px}
  .server.active{background:#00ff00;color:#000}
  input{width:100%;padding:12px;background:#000;border:1px solid #00ff00;color:#00ff00;border-radius:6px;margin:10px 0}
  .btn{width:100%;padding:14px;background:#00ff00;color:#000;border:none;font-weight:bold;cursor:pointer;border-radius:6px;margin-top:10px;font-size:16px}
  #result{margin-top:15px;padding:12px;background:#010101;border:1px dashed #00ff00;border-radius:6px;display:none}
  .code{font-size:22px;letter-spacing:3px;text-align:center;color:#fff;margin:8px 0}
  .links{margin-top:20px}
  .link{display:block;padding:10px;background:#010101;border:1px solid #00ff00;border-radius:6px;margin:8px 0;text-decoration:none;color:#00ff00;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h1>BONY<span style="color:#fff">XMD</span></h1>
  <p class="sub">⚡ PAIR SITES - SELECT TO CONNECT</p>
  
  <div class="tabs">
    <div class="tab active"># Pairing Code</div>
    <div class="tab">QR Code</div>
  </div>

  <p>SELECT PAIR SERVER</p>
  <div class="servers">
    <div class="server active">Server 1</div>
    <div class="server">Server 2</div>
    <div class="server">Server 3</div>
  </div>

  <p>PHONE NUMBER</p>
  <input type="text" id="number" placeholder="2547XXXXXXXX">
  <small>With country code, no +</small>
  
  <button class="btn" onclick="getCode()">⚡ GENERATE SESSION</button>

  <div id="result">
    <p>> SESSION: <b>BONY-BOT</b></p>
    <div class="code" id="codeBox"></div>
  </div>

  <div class="links">
    <a href="https://github.com/bonyke2-bot/BONY-XMD" class="link">📁 Github: bonyke2-bot/BONY-XMD</a>
    <a href="https://render.com" class="link">🚀 Deploy on RENDER</a>
  </div>
</div>

<script>
async function getCode() {
  const number = document.getElementById('number').value;
  const result = document.getElementById('result');
  const codeBox = document.getElementById('codeBox');
  if(!number) return alert('Enter number');
  result.style.display = 'block';
  codeBox.innerText = 'GENERATING...';
  
  const res = await fetch('/pair', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ number })
  });
  const data = await res.json();
  codeBox.innerText = data.code || 'ERROR';
}
</script>
</body>
</html>
