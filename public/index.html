<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONY XMD PAIR</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
  body{background:#000;color:#00ff00;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;background-image:radial-gradient(#00ff0022 1px, transparent 1px);background-size:20px 20px}
  .card{background:#020202;border:1px solid #00ff00;border-radius:12px;padding:25px;width:100%;max-width:520px;box-shadow:0 0 40px rgba(0,255,0,0.25)}
  h1{color:#00ff00;text-align:center;margin-bottom:5px;font-size:32px;text-shadow:0 0 15px #00ff00}
  .sub{text-align:center;color:#0a0;font-size:12px;margin-bottom:20px;letter-spacing:2px}
  .tabs{display:flex;gap:10px;margin-bottom:20px}
  .tab{flex:1;padding:10px;background:#010101;border:1px solid #00ff00;color:#00ff00;cursor:pointer;border-radius:6px;text-align:center}
  .tab.active{background:#00ff00;color:#000;font-weight:bold}
  .servers{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
  .server{padding:8px 14px;background:#010101;border:1px solid #00ff00;border-radius:6px;cursor:pointer;font-size:12px}
  .server.active{background:#00ff00;color:#000;font-weight:bold}
  input{width:100%;padding:12px;background:#000;border:1px solid #00ff00;color:#00ff00;border-radius:6px;margin:10px 0;font-size:15px}
  small{color:#0a0;font-size:11px}
  .btn{width:100%;padding:14px;background:#00ff00;color:#000;border:none;font-weight:bold;cursor:pointer;border-radius:6px;margin-top:15px;font-size:16px}
  .btn:hover{box-shadow:0 0 20px #00ff00;transform:scale(1.02)}
  #result{margin-top:20px;padding:15px;background:#010101;border:1px dashed #00ff00;border-radius:6px;display:none}
  .code{font-size:26px;letter-spacing:5px;text-align:center;color:#fff;margin:12px 0;background:#000;padding:10px;border-radius:5px}
  .links{margin-top:25px}
  .link{display:flex;align-items:center;gap:10px;padding:12px;background:#010101;border:1px solid #00ff00;border-radius:6px;margin:8px 0;text-decoration:none;color:#00ff00}
  .link:hover{background:#00ff0011}
  .dot{width:8px;height:8px;background:#00ff00;border-radius:50%;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="card">
  <h1>BONY<span style="color:#fff">XMD</span></h1>
  <p class="sub">⚡ PAIR SITES - SELECT TO CONNECT</p>
  
  <div class="tabs">
    <div class="tab active"># Pairing Code</div>
    <div class="tab">QR Code</div>
  </div>

  <p>SELECT PAIR SERVER</p>
